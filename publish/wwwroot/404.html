<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8" />
    <title>Weiterleitung&hellip;</title>
</head>

<body>
    <script>
        // GitHub Pages liefert für unbekannte Pfade die 404.html.
        // Die aufgerufene Route wird gemerkt und nach dem App-Start wiederhergestellt.
        var base = '/rezepte/';
        var path = location.pathname;
        var idx = path.indexOf('/rezepte');
        var suffix = idx >= 0 ? path.slice(idx + '/rezepte'.length).replace(/^\//, '') : path.replace(/^\//, '');
        if (suffix) {
            sessionStorage.setItem('rezept-return', suffix);
        }
        location.replace(base);
    </script>
</body>

</html>
