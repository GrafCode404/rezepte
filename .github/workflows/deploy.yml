name: Deploy zu GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: |
          VERSION=${{ github.run_number }}
          echo "Deploying version $VERSION"
          dotnet publish RezepteWeb.csproj -c Release -o publish -p:InformationalVersion=$VERSION

      - name: Strip SRI integrity hashes
        run: |
          # GitHub Pages CDN kann nach Deploys veraltete Dateien unter stabilen
          # Namen ausliefern -> SRI-Hashes wuerden dann den App-Start blockieren.
          DOTNET_JS=$(find publish/wwwroot/_framework -maxdepth 1 -name 'dotnet.*.js' ! -name 'dotnet.native.*' ! -name 'dotnet.runtime.*' | head -n 1)
          echo "Patching $DOTNET_JS"
          sed -i -E 's/"hash": "sha256-[A-Za-z0-9+\/=]+"/"hash": ""/g' "$DOTNET_JS"
          sed -i -E 's/ integrity="sha256-[A-Za-z0-9+\/=]+"//g' publish/wwwroot/index.html
          sed -i -E 's/"sha256-[A-Za-z0-9+\/=]+"/""/g' publish/wwwroot/index.html
          if grep -R "sha256-" publish/wwwroot/index.html "$DOTNET_JS"; then
            echo "FEHLER: Es sind noch sha256-Hashes vorhanden - Format hat sich geaendert."
            exit 1
          fi
          echo "SRI-Hashes entfernt"

      - name: Upload Pages-Artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4